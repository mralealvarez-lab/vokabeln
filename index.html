function normalize(str){
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Vibración táctil suave al acertar/fallar en los juegos. Silenciosa si el
   dispositivo/navegador no soporta la API (p. ej. Safari en iPhone). */
function haptic(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

  // Único cambio de declinación necesario con artículo definido: der -> den (masculino singular)

}

function hashStr(str){
  let h = 0;
  for(let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

const HABEN_CONJ = {ich:"habe", du:"hast", er:"hat", wir:"haben", ihr:"habt", sie:"haben"};
const SEIN_CONJ  = {ich:"bin", du:"bist", er:"ist", wir:"sind", ihr:"seid", sie:"sind"};
const WERDEN_CONJ = {ich:"werde", du:"wirst", er:"wird", wir:"werden", ihr:"werdet", sie:"werden"};

function getPreterite(esKey){ return VERB_PRETERITE[esKey] || null; }
function getPerfekt(esKey){
  const p = VERB_PERFEKT[esKey];
  if(!p) return null;
  if(p.forms) return p.forms;
  const auxConj = p.aux === "sein" ? SEIN_CONJ : HABEN_CONJ;
  const out = {};
  Object.keys(auxConj).forEach(pron => { out[pron] = `${auxConj[pron]} ${p.partizip}`; });
  return out;
}
function getFutur(infinitiv){
  const out = {};
  Object.keys(WERDEN_CONJ).forEach(pron => { out[pron] = `${WERDEN_CONJ[pron]} ${infinitiv}`; });
  return out;
}

const COLOQUIAL_LIST = [
 {de:"doch", es:"claro que sí / al contrario",

 {de:"na", es:"¿y bien? / vaya",

  example:"Na, wie geht's? (¿Qué tal, cómo estás?)"},
 {de:"halt", es:"es que / simplemente",

  example:"Das ist halt so. (Así son las cosas, ni modo.)"},
 {de:"eben", es:"exacto / precisamente",

 {de:"krass", es:"una locura / fuerte",

  examples:[

 {title:"Posesivos en plural siempre llevan '-e'",

function getPlural(w){ return PLURALS[wordKey(w)] || null; }
function getCompound(w){ return COMPOUNDS[wordKey(w)] || null; }

const NOUN_TEMPLATES = [
  de => `Das ist ${de}.`,
  de => `Ich sehe ${toAccusative(de)} dort.`,
  de => `Wo ist ${de}?`,
  de => `Ich brauche ${toAccusative(de)}.`,
];
const COLOR_TEMPLATES = [
  de => `Die Farbe ist ${de}.`,
  de => `Das Auto ist ${de}.`,
  de => `Ich mag ${de}.`,
];
const NUMBER_TEMPLATES = [
  de => `Die Zahl ist ${de}.`,
  de => `Ich zähle: ${de}.`,
];

function getExample(w){
  const idx = hashStr(w.es);
  if(w.cat === "colores") return COLOR_TEMPLATES[idx % COLOR_TEMPLATES.length](w.de);
  if(w.cat === "numeros") return NUMBER_TEMPLATES[idx % NUMBER_TEMPLATES.length](w.de);
  return NOUN_TEMPLATES[idx % NOUN_TEMPLATES.length](w.de);
}

/* ---- Pronunciación con la voz del navegador ---- */
function speak(text, lang){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){
    console.error("No se pudo reproducir el audio", e);
  }
}
const STORAGE_KEY = "vokabeln-known";

function wordKey(w){ return w.cat + "::" + w.es; }

/* Capa de almacenamiento: usa window.storage dentro de Claude, y localStorage
   cuando el archivo se abre suelto en cualquier navegador (compartido, instalado, etc).
   Si window.storage existe pero falla (p. ej. en la vista previa de archivos), cae a
   localStorage automáticamente en vez de mostrar un error. */
const hasClaudeStorage = (typeof window !== "undefined") && !!window.storage;

function safeLocalGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function safeLocalSet(key, value){
  try{ localStorage.setItem(key, value); }catch(e){}
}

async function loadProgress(){
  if(hasClaudeStorage){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      if(res && res.value){ state.known = JSON.parse(res.value); return; }
    }catch(e){ /* seguir con localStorage como respaldo */ }
  }
  try{
    const raw = safeLocalGet(STORAGE_KEY);
    if(raw){ state.known = JSON.parse(raw); }
  }catch(e){ state.known = {}; }
}
async function saveProgress(){
  if(hasClaudeStorage){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state.known));
      return;
    }catch(e){ /* seguir con localStorage como respaldo */ }
  }
  safeLocalSet(STORAGE_KEY, JSON.stringify(state.known));
}

const VOCAB_BY_KEY = {};
VOCAB.forEach(w => { VOCAB_BY_KEY[wordKey(w)] = w; });

const REVIEW_BATCH = 24;

function reviewPending(){
  return state.reviewQueue.map(k => VOCAB_BY_KEY[k]).filter(w => w && !state.known[wordKey(w)]);
}

function currentList(){
  if(state.reviewMode){
    return reviewPending().slice(0, REVIEW_BATCH);
  }
  if(state.query.trim() !== ""){
    const q = normalize(state.query.trim());
    return VOCAB.filter(w => normalize(w.es).includes(q) || normalize(w.de).includes(q));
  }
  if(state.category === "todos") return VOCAB;
  return VOCAB.filter(w => w.cat === state.category);
}

function toggleReview(){
  state.reviewMode = !state.reviewMode;
  if(state.reviewMode){
    const pending = VOCAB.filter(w => !state.known[wordKey(w)]);
    state.reviewQueue = shuffleArr(pending.map(w => wordKey(w)));
  }
  state.flipped = {};
  document.getElementById("btnReview").classList.toggle("active", state.reviewMode);
  document.getElementById("btnReview").textContent = state.reviewMode ? "✕ Salir del repaso" : "🔁 Repasar pendientes";
  document.getElementById("cats").classList.toggle("disabled", state.reviewMode);
  document.getElementById("searchInput").disabled = state.reviewMode;
  renderCats();
  renderBoard();
}

function renderCats(){
  const el = document.getElementById("cats");
  const rest = Object.keys(CAT_LABELS)
    .filter(c => c !== "todos")
    .sort((a, b) => CAT_LABELS[a].localeCompare(CAT_LABELS[b], "es"));
  const cats = ["todos", ...rest];
  el.innerHTML = "";
  cats.forEach(c => {
    const count = c === "todos" ? VOCAB.length : VOCAB.filter(w => w.cat === c).length;
    const btn = document.createElement("button");
    btn.className = "cat-pill" + (c === state.category ? " active" : "");
    btn.innerHTML = `${CAT_LABELS[c]}<span class="count-badge">${count}</span>`;
    btn.onclick = () => { state.category = c; state.flipped = {}; renderCats(); renderBoard(); };
    el.appendChild(btn);
  });
  el.classList.toggle("disabled", state.query.trim() !== "" || state.reviewMode);
}

function renderBoard(){
  const list = currentList();
  const board = document.getElementById("board");
  board.innerHTML = "";
  const searching = state.query.trim() !== "";

  if(list.length === 0){
    const emptyMsg = state.reviewMode
      ? `<div class="word">¡Repaso completo! 🎉</div><div>Ya marcaste como sabidas todas las palabras pendientes.</div>`
      : `<div class="word">Sin resultados</div><div>Prueba con otra palabra en español o alemán.</div>`;
    board.innerHTML = `<div class="empty" style="grid-column: 1 / -1;">${emptyMsg}</div>`;
    renderProgress();
    return;
  }

  list.forEach(w => {
    const key = wordKey(w);
    const isKnown = !!state.known[key];
    const isFlipped = !!state.flipped[key];
    const iconSvg = ICONS[key] || `<circle cx="50" cy="50" r="30" ${S}/>`;
    const catTag = searching ? `<div class="word-label">${CAT_LABELS[w.cat] || ''}</div>` : '';
    const deEsc = w.de.replace(/'/g, "\\'");
    const isVerb = w.cat === "verbos";
    const conj = isVerb ? getConjugation(w) : null;

    const cell = document.createElement("div");
    cell.className = "cell" + (isVerb ? " wide" : "");

    if(isVerb && conj){
      const example = VERB_EXAMPLES[key] || "";
      const order = [["ich","du","er"],["wir","ihr","sie"]];
      const conjHtml = order.map(col => col.map(p =>
        `<div class="conj-row"><span class="conj-pron">${p}</span><span class="conj-form">${conj[p]}</span></div>`
      ).join("")).join("");
      cell.innerHTML = `
      <div class="card ${isFlipped ? 'flipped' : ''} ${isKnown ? 'known' : ''}" data-key="${key}">
        <button class="known-btn" data-key="${key}">✓</button>
        <div class="face front">
          <div class="icon-wrap"><svg viewBox="0 0 100 100">${iconSvg}</svg></div>
          <div class="es-caption">${w.es}</div>
          <div class="verb-tag">verbo</div>
          ${catTag}
        </div>
        <div class="face back">
          <button class="speak-btn" data-text="${deEsc}" data-lang="de-DE">🔊</button>
          <div class="word-label">Infinitiv</div>
          <div class="word de">${w.de}</div>
          <div class="conj-grid">${conjHtml}</div>
          <div class="example">${example}</div>
        </div>
      </div>`;
      board.appendChild(cell);
      return;
    }

    const example = getExample(w);
    const plural = getPlural(w);
    const compound = getCompound(w);
    const pluralHtml = plural ? `<div class="plural-line"><span class="lbl">Pl.:</span>${plural}</div>` : '';
    const compoundHtml = compound
      ? `<div class="compound-wrap">${compound.map(([part, mean]) => `<span class="compound-part"><b>${part}</b>${mean}</span>`).join('<span class="compound-plus">+</span>')}</div>`
      : '';

    cell.innerHTML = `
      <div class="card ${isFlipped ? 'flipped' : ''} ${isKnown ? 'known' : ''}" data-key="${key}">
        <button class="known-btn" data-key="${key}">✓</button>
        <div class="face front">
          <div class="icon-wrap"><svg viewBox="0 0 100 100">${iconSvg}</svg></div>
          <div class="es-caption">${w.es}</div>
          ${catTag}
        </div>
        <div class="face back">
          <button class="speak-btn" data-text="${deEsc}" data-lang="de-DE">🔊</button>
          <div class="word-label">Deutsch</div>
          <div class="word de">${w.de}</div>
          ${pluralHtml}
          ${compoundHtml}
          <div class="example">${example}</div>
        </div>
      </div>`;
    board.appendChild(cell);
  });

  board.querySelectorAll(".speak-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      speak(btn.dataset.text, btn.dataset.lang);
    });
  });

  board.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", (e) => {
      if(e.target.closest(".known-btn")) return;
      const key = card.dataset.key;
      state.flipped[key] = !state.flipped[key];
      card.classList.toggle("flipped");
    });
  });

  board.querySelectorAll(".known-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const key = btn.dataset.key;
      state.known[key] = !state.known[key];
      haptic([12]);
      await saveProgress();
      renderBoard();
      renderProgress();
      checkAchievements();
    });
  });

  renderProgress();
}

function renderProgress(){
  const list = currentList();
  if(state.reviewMode){
    const total = state.reviewQueue.length;
    const remaining = reviewPending().length;
    const done = total - remaining;
    const pct = total ? Math.round((done/total)*100) : 0;
    document.getElementById("progressText").textContent = `${remaining} pendientes por repasar`;
    document.getElementById("progressPct").textContent = pct + "%";
    document.getElementById("progressFill").style.width = pct + "%";
    return;
  }
  const total = list.length;
  const knownCount = list.filter(w => state.known[wordKey(w)]).length;
  const pct = total ? Math.round((knownCount/total)*100) : 0;
  const label = state.query.trim() !== "" ? "en tu búsqueda" : "en esta categoría";
  document.getElementById("progressText").textContent = `${knownCount} / ${total} ${label}`;
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("progressFill").style.width = pct + "%";
}

document.getElementById("btnReview").addEventListener("click", toggleReview);

document.getElementById("btnFlipAll").addEventListener("click", () => {
  const list = currentList();
  const anyUnflipped = list.some(w => !state.flipped[wordKey(w)]);
  list.forEach(w => { state.flipped[wordKey(w)] = anyUnflipped; });
  renderBoard();
});

document.getElementById("resetBtn").addEventListener("click", async () => {
  state.known = {};
  await saveProgress();
  renderBoard();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  state.query = e.target.value;

let verbState = { query: "", selected: null };

function verbFlags(v){
  const key = `verbos::${v.es}`;
  const isReflexive = v.de.startsWith("sich ");
  const stem = isReflexive ? v.de.slice(5) : v.de;
  const presente = VERB_CONJUGATIONS[key];
  const ichForm = presente ? presente.ich : "";
  const tokens = ichForm.split(" ");
  const lastToken = tokens[tokens.length - 1];
  const reflexivePronouns = ["mich", "dich", "sich", "uns", "euch"];
  const isSeparable = tokens.length > 1 && !reflexivePronouns.includes(lastToken) && stem.startsWith(lastToken);
  return { isReflexive, isSeparable };
}

function verbBadgesHtml(v){
  const { isReflexive, isSeparable } = verbFlags(v);
  const badges = [];
  if(isReflexive) badges.push('<span class="vc-badge">reflexivo</span>');
  if(isSeparable) badges.push('<span class="vc-badge">separable</span>');
  return badges.join("");
}

function conjRowsHtml(conj){
  const order = [["ich","du","er"],["wir","ihr","sie"]];
  return order.map(col => col.map(p =>
    `<div class="conj-row"><span class="conj-pron">${p}</span><span class="conj-form">${conj[p]}</span></div>`
  ).join("")).join("");
}

function verbDetailHtml(v){
  const key = `verbos::${v.es}`;
  const presente = VERB_CONJUGATIONS[key];
  const pasado = getPreterite(key);
  const perfecto = getPerfekt(key);
  const futuro = getFutur(v.de);
  const example = VERB_EXAMPLES[key] || "";
  const deEsc = v.de.replace(/'/g, "\\'");
  const badges = verbBadgesHtml(v);

  return `
    <div class="verb-detail">
      <div class="vd-head">
        <button class="vd-speak" data-text="${deEsc}" data-lang="de-DE">🔊</button>
        <div class="vd-es">${v.es}</div>
        <div class="vd-de">${v.de}</div>
        ${badges ? `<div class="vd-badges">${badges}</div>` : ''}
      </div>
      <div class="tense-block">
        <div class="tense-title">Presente · Präsens</div>
        <div class="conj-grid">${conjRowsHtml(presente)}</div>
      </div>
      <div class="tense-block">
        <div class="tense-title">Pasado · Präteritum</div>
        <div class="conj-grid">${conjRowsHtml(pasado)}</div>
      </div>
      <div class="tense-block">
        <div class="tense-title">Perfecto · Perfekt</div>
        <div class="conj-grid">${conjRowsHtml(perfecto)}</div>
      </div>
      <div class="tense-block">
        <div class="tense-title">Futuro · Futur I</div>
        <div class="conj-grid">${conjRowsHtml(futuro)}</div>
      </div>
      ${example ? `<div class="vd-example">${example}</div>` : ''}
    </div>
  `;
}

function getPluralExample(plural){
  return `Das sind ${plural}.`;
}

async function handleGenderAnswer(chosen, correctArt){
  if(genderState.answered) return;
  genderState.answered = true;
  genderState.total++;
  genderStats.total++;
  const isCorrect = chosen === correctArt;
  if(isCorrect){ genderState.correct++; genderStats.correct++; }
  haptic(isCorrect ? [15] : [10,60,10]);
  await saveGenderStats();

  document.querySelectorAll(".article-btn").forEach(btn => {
    btn.disabled = true;
    if(btn.dataset.art === correctArt) btn.classList.add("correct");
    else if(btn.dataset.art === chosen) btn.classList.add("wrong");
  });
  renderGenderScore();

  const key = genderState.queue[genderState.index];
  const w = VOCAB_BY_KEY[key];
  const plural = getPlural(w);
  if(plural){
    const resultLine = isCorrect
      ? `✅ ¡Muy bien! Recuerda: en plural es <b>${plural}</b>.`
      : `❌ Era «${correctArt}». En plural es <b>${plural}</b>.`;
    const singularEx = getExample(w);
    const pluralEx = getPluralExample(plural);
    const info = document.createElement("div");
    info.className = "gender-info";
    info.innerHTML = `
      <div class="plural-line">${resultLine}</div>
      <div class="example">${singularEx}</div>
      <div class="example">${pluralEx}</div>

  }

  const nextBtn = document.createElement("button");
  nextBtn.className = "game-next";
  nextBtn.textContent = "Siguiente →";
  nextBtn.addEventListener("click", () => {
    genderState.index++;
    genderState.answered = false;
    renderGenderCard();
  });
  document.getElementById("genderCard").querySelector(".game-card").appendChild(nextBtn);
}

/* ============ Modo escucha (audio → elegir significado) ============ */
let listenState = { queue: [], index: 0, correct: 0, total: 0, answered: false, history: [] };

function startListenRound(){
  const n = Math.min(15, VOCAB.length);
  listenState.queue = shuffleArr(VOCAB.map(w => wordKey(w))).slice(0, n);
  listenState.index = 0;
  listenState.correct = 0;
  listenState.total = 0;
  listenState.answered = false;
  listenState.history = [];
  renderListenScore();
  renderListenCard();
}

function renderListenScore(){
  document.getElementById("listenScore").innerHTML =
    `<div>Pregunta <b>${Math.min(listenState.index+1, listenState.queue.length)}/${listenState.queue.length}</b></div>` +
    `<div>Aciertos: <b>${listenState.correct}/${listenState.total}</b></div>`;
}

function pickListenDistractors(correctWord, n){
  const sameCat = VOCAB.filter(w => w.cat === correctWord.cat && w.es !== correctWord.es);
  const source = sameCat.length >= n ? sameCat : VOCAB.filter(w => w.es !== correctWord.es);
  return shuffleArr(source).slice(0, n);
}

function renderListenSummary(el){
  const pct = listenState.total ? Math.round((listenState.correct/listenState.total)*100) : 0;
  const wrongOnes = listenState.history.filter(h => !h.isCorrect);
  const rightOnes = listenState.history.filter(h => h.isCorrect);

  const wrongHtml = wrongOnes.map(h => {
    const w = VOCAB_BY_KEY[h.key];
    return `
      <div class="exam-review-item wrong">
        <div class="eri-head"><span>${w.de}</span><span class="eri-mark">❌</span></div>
        <div class="eri-chosen">Tu respuesta: ${h.chosen}</div>
        <div class="eri-correct-answer">Correcto: ${w.es}</div>
      </div>`;
  }).join("");

  const rightHtml = rightOnes.map(h => {
    const w = VOCAB_BY_KEY[h.key];
    return `<div class="exam-review-item correct"><div class="eri-head"><span>${w.de} — ${w.es}</span><span class="eri-mark">✅</span></div></div>`;
  }).join("");

  el.innerHTML = `
    <div class="game-card game-summary">
      <div class="gs-big">${pct}%</div>
      <div>Acertaste ${listenState.correct} de ${listenState.total} palabras.</div>
      ${wrongOnes.length ? `<div class="exam-review"><div class="tense-title">Para repasar</div>${wrongHtml}</div>` : ''}
      ${rightOnes.length ? `<div class="exam-review"><div class="tense-title">Correctas</div>${rightHtml}</div>` : ''}
    </div>`;
}

function renderListenCard(){
  renderListenScore();
  const el = document.getElementById("listenCard");
  if(listenState.index >= listenState.queue.length){
    renderListenSummary(el);
    return;
  }
  const key = listenState.queue[listenState.index];
  const w = VOCAB_BY_KEY[key];

/* ============ Verbos: juego de Tiempos ============ */
const TENSE_LABELS = { presente: "Presente", pasado: "Pasado", perfecto: "Perfecto", futuro: "Futuro" };
const TENSE_KEYS = ["presente", "pasado", "perfecto", "futuro"];
const PRONOUNS = ["ich", "du", "er", "wir", "ihr", "sie"];

function getTenseForm(v, tense){
  const key = `verbos::${v.es}`;
  if(tense === "presente") return VERB_CONJUGATIONS[key];
  if(tense === "pasado") return getPreterite(key);
  if(tense === "perfecto") return getPerfekt(key);
  if(tense === "futuro") return getFutur(v.de);
  return null;
}

let tensesState = { queue: [], index: 0, correct: 0, total: 0, answered: false };

function buildTenseQuestion(){
  const v = VERBS_LIST[Math.floor(Math.random() * VERBS_LIST.length)];
  const tense = TENSE_KEYS[Math.floor(Math.random() * TENSE_KEYS.length)];
  const forms = getTenseForm(v, tense);
  const pronoun = PRONOUNS[Math.floor(Math.random() * PRONOUNS.length)];
  const correct = forms[pronoun];
  // "wir" y "sie" (plural) siempre comparten la misma forma verbal en alemán —
  // se descartan formas duplicadas para no repetir la misma opción dos veces.
  const seenForms = new Set([correct]);
  const distractorForms = [];
  shuffleArr(PRONOUNS.filter(p => p !== pronoun)).forEach(p => {
    if(distractorForms.length >= 3) return;
    const f = forms[p];
    if(seenForms.has(f)) return;
    seenForms.add(f);
    distractorForms.push(f);
  });
  const options = shuffleArr([correct, ...distractorForms]);
  return { v, tense, pronoun, correct, options };
}

function startTensesRound(){
  tensesState.queue = Array.from({length: 15}, buildTenseQuestion);
  tensesState.index = 0;
  tensesState.correct = 0;
  tensesState.total = 0;
  tensesState.answered = false;
  renderTensesScore();
  renderTensesCard();
}

function renderTensesScore(){
  document.getElementById("tensesScore").innerHTML =
    `<div>Pregunta <b>${Math.min(tensesState.index+1, tensesState.queue.length)}/${tensesState.queue.length}</b></div>` +
    `<div>Aciertos: <b>${tensesState.correct}/${tensesState.total}</b></div>`;
}

function renderTensesCard(){
  renderTensesScore();
  const el = document.getElementById("tensesCard");
  if(tensesState.index >= tensesState.queue.length){
    const pct = tensesState.total ? Math.round((tensesState.correct/tensesState.total)*100) : 0;
    el.innerHTML = `
      <div class="game-card game-summary">
        <div class="gs-big">${pct}%</div>
        <div>Acertaste ${tensesState.correct} de ${tensesState.total} preguntas.</div>
      </div>`;
    return;
  }
  const q = tensesState.queue[tensesState.index];
  el.innerHTML = `
    <div class="game-card">
      <div class="gc-es">${q.v.es} <span style="opacity:.5;font-style:italic;">(${q.v.de})</span></div>
      <div class="tense-question"><span class="tq-tense">${TENSE_LABELS[q.tense]}</span> · <b>${q.pronoun}</b></div>
      <div class="exam-options">
        ${q.options.map(o => `<button class="exam-option" data-form="${o.replace(/"/g,'&quot;')}">${o}</button>`).join("")}
      </div>
    </div>`;
  el.querySelectorAll(".exam-option").forEach(btn => {
    btn.addEventListener("click", () => handleTensesAnswer(btn.dataset.form, q));
  });
}

function pronounCap(p){
  const map = {ich:"Ich", du:"Du", er:"Er", wir:"Wir", ihr:"Ihr", sie:"Sie"};
  return map[p] || p;
}
function buildTenseExample(pronoun, form){
  return `${pronounCap(pronoun)} ${form}.`;
}

function handleTensesAnswer(chosen, q){
  if(tensesState.answered) return;
  tensesState.answered = true;
  tensesState.total++;
  const isCorrect = chosen === q.correct;
  if(isCorrect) tensesState.correct++;
  haptic(isCorrect ? [15] : [10,60,10]);

  document.querySelectorAll("#tensesCard .exam-option").forEach(btn => {
    btn.disabled = true;
    if(btn.dataset.form === q.correct) btn.classList.add("correct");
    else if(btn.dataset.form === chosen) btn.classList.add("wrong");
  });
  renderTensesScore();

  const resultLine = isCorrect

/* ============ Logros: racha de días + hitos de palabras dominadas ============ */
const WORD_MILESTONES = [10, 25, 50, 100, 200, 400, 600, 900, 1200, 1600];
const STREAK_MILESTONES = [3, 7, 14, 30, 60, 100];
const ACHV_KEY = "vokabeln-achievements";
let achvData = { shownWords: [], shownStreak: [], streak: 0, lastDate: null };

async function loadAchievements(){
  if(hasClaudeStorage){
    try{
      const res = await window.storage.get(ACHV_KEY);
      if(res && res.value){ achvData = JSON.parse(res.value); return; }
    }catch(e){ /* seguir con localStorage como respaldo */ }
  }
  try{
    const raw = safeLocalGet(ACHV_KEY);
    if(raw){ achvData = JSON.parse(raw); }
  }catch(e){ /* usar valores por defecto */ }
}
async function saveAchievements(){
  const json = JSON.stringify(achvData);
  if(hasClaudeStorage){
    try{ await window.storage.set(ACHV_KEY, json); return; }
    catch(e){ /* seguir con localStorage como respaldo */ }
  }
  safeLocalSet(ACHV_KEY, json);
}

function todayStr(){ return new Date().toISOString().slice(0, 10); }

function updateStreak(){
  const today = todayStr();
  if(achvData.lastDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  achvData.streak = (achvData.lastDate === yesterday) ? achvData.streak + 1 : 1;
  achvData.lastDate = today;
}

let toastQueue = [];
let toastShowing = false;
function queueToast(text){
  toastQueue.push(text);
  if(!toastShowing) showNextToast();
}
function showNextToast(){
  if(toastQueue.length === 0){ toastShowing = false; return; }
  toastShowing = true;
  const text = toastQueue.shift();
  const toast = document.createElement("div");
  toast.className = "achv-toast";
  toast.textContent = text;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("show"));
  haptic([15, 40, 15]);
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => { toast.remove(); showNextToast(); }, 400);
  }, 3000);
}

function checkAchievements(){
  const totalKnown = Object.values(state.known).filter(Boolean).length;
  let changed = false;
  WORD_MILESTONES.forEach(m => {
    if(totalKnown >= m && !achvData.shownWords.includes(m)){
      achvData.shownWords.push(m);
      queueToast(`🏆 ¡${m} palabras dominadas!`);
      changed = true;
    }
  });
  STREAK_MILESTONES.forEach(m => {
    if(achvData.streak >= m && !achvData.shownStreak.includes(m)){
      achvData.shownStreak.push(m);
      queueToast(`🔥 ¡Racha de ${m} días seguidos!`);
      changed = true;
    }
  });
  if(changed) saveAchievements();
}

(async function init(){
  await loadProgress();
  await loadGenderStats();
  await loadAchievements();
  updateStreak();
  await saveAchievements();
  if(state.query.trim() !== ""){
    document.getElementById("searchInput").value = state.query;
    document.getElementById("searchClear").classList.add("show");
  }
  renderCats();
  renderBoard();
  renderVerbList();
  renderColoqList();
  renderTips();
  checkAchievements();
})();
</script>
</body>
</html>
